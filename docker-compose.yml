version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend-java
      - backend-ml-python

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  backend-ml-python:
    build:
      context: ./backend-ml-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
